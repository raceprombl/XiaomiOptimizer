name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: XiOptimizer-windows-amd64.exe
          - goos: darwin
            goarch: arm64
            output: XiOptimizer-darwin-arm64
          - goos: darwin
            goarch: amd64
            output: XiOptimizer-darwin-amd64
          - goos: linux
            goarch: amd64
            output: XiOptimizer-linux-amd64
          - goos: linux
            goarch: arm64
            output: XiOptimizer-linux-arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -o ${{ matrix.output }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package Windows ZIP Bundle
        run: |
          mkdir -p win-bundle
          cp release-assets/XiOptimizer-windows-amd64.exe win-bundle/XiOptimizer.exe
          cd win-bundle && zip ../release-assets/XiOptimizer-windows-amd64.zip XiOptimizer.exe && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: XiOptimizer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
